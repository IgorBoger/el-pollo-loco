    <h1>El Pollo Loco</h1>

    <div id="gameContainer">
        <div id="startScreen">
            <img id="startscreenImg" src="img/9_intro_outro_screens/start/startscreen_1.png">

        </div>

        <canvas id="canvas" width="720" height="480">

        </canvas>

        <!-- NEU: Hamburger-Button -->
        <button id="burgerBtn" class="control-btn" aria-label="Menü">☰</button>

        <!-- Burger-Menü -->
        <div id="burgerMenu" class="burger-overlay d-none">
            <div class="burger-header">
                <!-- Settings-Icon: öffnet direkt Settings-Overlay -->
                <button id="openSettings" class="settings-button" aria-label="Settings">
                    <img src="img/settings.png" alt="Settings" class="icon-img">
                </button>
                <!-- Back-Button: schließt Burger-Menü -->
                <button id="burgerClose" class="settings-button" aria-label="Zurück">
                    <img src="img/arrow-right.png" alt="Zurück" class="icon-img">
                </button>
            </div>

            <ul>
                <li><button id="restartGame" class="menu-btn">🔄 Neustart</button></li>
                <li><button id="showControls" class="menu-btn">🎮 Steuerung</button></li>
                <li><button id="aboutGame" class="menu-btn">ℹ️ Über das Spiel</button></li>
            </ul>
        </div>

        <!-- Settings-Overlay (separat) -->
        <div id="settingsOverlay" class="settings-overlay d-none">
            <div class="settings-header">
                <button id="closeSettings" class="settings-button">
                    <img id="closeIcon" src="img/arrow-right.png" alt="Close" class="icon-img">
                </button>
            </div>
            <div class="setting-row">
                <span>Musik</span>
                <button id="musicToggle" class="toggle-btn">
                    <img id="musicIcon" src="img/speaker.png" alt="Musik" class="icon-img">
                </button>
            </div>
            <div class="setting-row">
                <span>Ton</span>
                <button id="soundToggle" class="toggle-btn">
                    <img id="soundIcon" src="img/speaker.png" alt="Ton" class="icon-img">
                </button>
            </div>
            <div class="setting-row">
                <span>Sprache</span>
                <button id="langToggle" class="toggle-btn">DE</button>
            </div>
        </div>

        <!-- Fullscreen Button -->
        <button id="fullscreenBtn" onclick="toggleFullscreen()">⛶</button>
    </div>

    <div id="mobileControls" class="d-none">
        <button class="control-btn" id="btnLeft">⬅️</button>
        <button class="control-btn" id="btnRight">➡️</button>
        <button class="control-btn" id="btnJump">⤴️ Springen</button>
        <button class="control-btn" id="btnThrow">🧴 Werfen</button>
    </div>
